<style>
    /* Neue Ansicht der Auswertung (Vorschau). Alles unter .ev2 bzw. v2_, damit sie neben der klassischen Ansicht laufen kann.
       Hell/Dunkel folgt dem Symcon-Design wie die klassische Ansicht (--card-color, --content-color). */
    .ev2 { --v-fb-bg: #ffffff; --v-fb-text: #1f2933; --v-c-acc: #2F80ED; --v-c-lim: #F59E0B; }
    @media (prefers-color-scheme: dark) { .ev2 { --v-fb-bg: #2b2d31; --v-fb-text: #f1f3f5; } }
    .ev2 {
        --v-bg: var(--card-color, var(--v-fb-bg)); --v-text: var(--content-color, var(--v-fb-text));
        --v-muted: #6b7280; --v-lane: #f3f5f8; --v-line: #e8ebf0; --v-grid: #eef0f3; --v-base: #d1d5db;
        --v-acc: var(--v-c-acc); --v-acc-wash: rgba(47, 128, 237, .13); --v-lim: var(--v-c-lim); --v-lim-ink: #92400e; --v-lim-wash: rgba(245, 158, 11, .16);
        --v-up: #0f8a5f; --v-dn: #c2410c;
    }
    .ev2[data-theme="dark"] { --v-muted: #a1a7b0; --v-lane: #34363b; --v-line: #44474d; --v-grid: #3a3d42; --v-base: #55585f; --v-acc: #5b9bf0; --v-lim-ink: #fcd34d; --v-up: #34d399; --v-dn: #fb923c; }
    @supports (color: color-mix(in srgb, red, blue)) {
        .ev2 {
            --v-muted: color-mix(in srgb, var(--v-text) 62%, var(--v-bg));
            --v-lane: color-mix(in srgb, var(--v-text) 5%, var(--v-bg));
            --v-line: color-mix(in srgb, var(--v-text) 11%, var(--v-bg));
            --v-grid: color-mix(in srgb, var(--v-text) 7%, var(--v-bg));
            --v-base: color-mix(in srgb, var(--v-text) 22%, var(--v-bg));
            --v-acc: color-mix(in srgb, var(--v-c-acc) 84%, var(--v-text));
            --v-acc-wash: color-mix(in srgb, var(--v-c-acc) 14%, transparent);
            --v-lim: color-mix(in srgb, var(--v-c-lim) 90%, var(--v-text));
            --v-lim-ink: color-mix(in srgb, var(--v-c-lim) 55%, var(--v-text));
            --v-lim-wash: color-mix(in srgb, var(--v-c-lim) 17%, transparent);
            --v-up: color-mix(in srgb, #10b981 70%, var(--v-text));
            --v-dn: color-mix(in srgb, #f97316 72%, var(--v-text));
        }
    }
    .ev2 { position: relative; font-family: Arial, Helvetica, sans-serif; color: var(--v-text); padding: 4px; font-size: 13px; line-height: 1.4; }
    .ev2 * { box-sizing: border-box; }
    .ev2 button { font: inherit; color: inherit; }
    .ev2.busy .v2-body { opacity: .55; transition: opacity .2s; }
    .v2-hd { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px; margin-bottom: 6px; }
    .v2-title { font-size: 17px; font-weight: 700; }
    .v2-crumb { display: flex; flex-wrap: wrap; gap: 2px 4px; font-size: 12px; margin-top: 2px; color: var(--v-muted); }
    .v2-crumb button { border: 0; background: transparent; color: var(--v-acc); padding: 0; cursor: pointer; }
    .v2-src { font-size: 11px; color: var(--v-muted); margin-top: 2px; }
    .v2-note { font-size: 12px; color: var(--v-lim-ink); background: var(--v-lim-wash); border-radius: 8px; padding: 4px 8px; margin-top: 4px; }
    .v2-ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .v2-sel { font: inherit; font-size: 13px; color: var(--v-text); background: var(--v-bg); border: 1px solid var(--v-base); border-radius: 8px; padding: 5px 6px; max-width: 260px; }
    .v2-seg { display: inline-flex; background: var(--v-lane); border-radius: 9px; padding: 2px; gap: 2px; }
    .v2-seg button { border: 0; background: transparent; color: var(--v-muted); padding: 4px 9px; border-radius: 7px; cursor: pointer; font-size: 12px; }
    .v2-seg button[aria-pressed="true"] { background: var(--v-bg); color: var(--v-text); font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
    .v2-seg button:disabled { opacity: .45; cursor: not-allowed; }

    .v2-step button:disabled { opacity: .3; cursor: default; }

    .v2-csv { border: 1px solid var(--v-line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; }
    .ev2 [hidden] { display: none !important; }
    .v2-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--v-line); margin: 2px 0 12px; overflow-x: auto; scrollbar-width: none; }
    .v2-tabs button { border: 0; background: transparent; padding: 8px 12px 9px; cursor: pointer; color: var(--v-muted); font-weight: 700; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
    .v2-tabs button[aria-selected="true"] { color: var(--v-text); border-bottom-color: var(--v-acc); }
    .v2-tabs .b { font-size: 11px; background: var(--v-lim-wash); color: var(--v-lim-ink); border-radius: 999px; padding: 0 6px; }
    .v2-grid { display: grid; gap: 12px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
    .v2-card { border: 1px solid var(--v-line); border-radius: 12px; padding: 12px 14px; min-width: 0; grid-column: span 12; }
    .v2-card.c8 { grid-column: span 8; } .v2-card.c7 { grid-column: span 7; } .v2-card.c6 { grid-column: span 6; } .v2-card.c5 { grid-column: span 5; } .v2-card.c4 { grid-column: span 4; } .v2-card.c3 { grid-column: span 3; }
    @media (max-width: 860px) { .v2-card.c8, .v2-card.c7, .v2-card.c6, .v2-card.c5, .v2-card.c4 { grid-column: span 12; } .v2-card.c3 { grid-column: span 6; } }
    @media (max-width: 480px) { .v2-card.c3 { grid-column: span 12; } }
    .v2-ch { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; margin-bottom: 8px; }
    .v2-ch h4 { margin: 0; font-size: 14px; }
    .v2-ch .m { color: var(--v-muted); font-size: 12px; }
    .v2-expl { color: var(--v-muted); font-size: 12px; margin: -2px 0 10px; }
    .v2-q { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--v-base); color: var(--v-muted); font-size: 10px; font-weight: 700; cursor: help; margin-left: 4px; }
    .v2-kpi { cursor: pointer; }
    .v2-kpi:hover { border-color: var(--v-base); background: var(--v-lane); }
    .v2-kpi .l { color: var(--v-muted); font-size: 12px; display: flex; justify-content: space-between; gap: 6px; }
    .v2-kpi .go { color: var(--v-acc); font-size: 11px; font-weight: 700; }
    .v2-kpi .v { font-size: 25px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
    .v2-kpi .v small { font-size: 13px; font-weight: 400; color: var(--v-muted); margin-left: 3px; }
    .v2-kpi .s { color: var(--v-muted); font-size: 12px; }
    .v2-kpi .s b { color: var(--v-text); }
    .v2-kpi .up { color: var(--v-up); font-weight: 700; } .v2-kpi .dn { color: var(--v-dn); font-weight: 700; }
    .v2-kpi.warn { background: var(--v-lim-wash); border-color: transparent; }
    .v2-kpi.warn .v { color: var(--v-lim-ink); }
    .v2-kpi.static { cursor: default; } .v2-kpi.static:hover { background: transparent; border-color: var(--v-line); }
    .v2-bar2 { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--v-lane); margin: 6px 0 4px; }
    .v2-bar2 i { display: block; height: 100%; }
    .v2-h { background: repeating-linear-gradient(45deg, var(--v-acc) 0 1.5px, transparent 1.5px 4.5px); opacity: .75; }
    .v2-ins { display: grid; gap: 7px; }
    .v2-ins button { text-align: left; border: 1px solid var(--v-line); background: transparent; border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 24px 1fr auto; gap: 9px; align-items: center; }
    .v2-ins button:hover { background: var(--v-lane); }

    .v2-ins .ic.w { background: var(--v-lim-wash); color: var(--v-lim-ink); }
    .v2-ins .a { color: var(--v-acc); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .ev2 svg { display: block; width: 100%; overflow: visible; }
    .ev2 svg text { font: 11px Arial, Helvetica, sans-serif; fill: var(--v-muted); }
    .ev2 .gl { stroke: var(--v-grid); } .ev2 .bl { stroke: var(--v-base); }
    .ev2 .bud { stroke: var(--v-lim); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .ev2 .budt { fill: var(--v-lim-ink); font-weight: 700; }
    .ev2 .xh { stroke: var(--v-text); stroke-opacity: .35; pointer-events: none; }
    .ev2 .hit { fill: transparent; cursor: pointer; }
    .ev2 .hit.nc { cursor: default; }
    .v2-lg { display: flex; flex-wrap: wrap; gap: 5px 14px; font-size: 12px; color: var(--v-muted); margin-top: 8px; align-items: center; }
    .v2-lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .v2-lg .hh { background: repeating-linear-gradient(45deg, var(--v-muted) 0 1.5px, transparent 1.5px 4px); }
    .v2-lg .ramp i { width: 14px; margin: 0 1px; border-radius: 2px; }
    .v2-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .v2-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--v-line); border-radius: 999px; padding: 2px 10px 2px 6px; font-size: 12px; cursor: pointer; background: transparent; }
    .v2-chip i { width: 10px; height: 10px; border-radius: 3px; }
    .v2-chip.off { opacity: .4; }
    .v2-soon { border: 1px dashed var(--v-base); border-radius: 12px; padding: 14px; color: var(--v-muted); font-size: 12.5px; grid-column: span 12; }
    .v2-soon b { color: var(--v-text); }
    .v2-x { border: 0; background: var(--v-lane); width: 26px; height: 26px; border-radius: 7px; cursor: pointer; font-size: 15px; }
    .v2-pill { display: inline-flex; align-items: center; gap: 4px; background: var(--v-lim-wash); color: var(--v-lim-ink); border-radius: 999px; padding: 1px 8px; font-weight: 700; font-size: 12px; }
    .v2-empty { color: var(--v-muted); padding: 18px 0; text-align: center; }
    .v2-tbl { overflow-x: auto; }
    .v2-tbl table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 640px; }
    .v2-tbl th { text-align: right; font-weight: 400; font-size: 11.5px; color: var(--v-muted); padding: 6px 8px; border-bottom: 1px solid var(--v-line); white-space: nowrap; cursor: pointer; user-select: none; }
    .v2-tbl th[aria-sort] { color: var(--v-text); }
    .v2-tbl th:first-child, .v2-tbl td:first-child { text-align: left; }
    .v2-tbl td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--v-line); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .v2-tbl tbody tr[data-drill] { cursor: pointer; }
    .v2-tbl tbody tr:hover td { background: var(--v-lane); }
    .v2-tbl tfoot td { font-weight: 700; border-bottom: 0; }
    .v2-tbl .sub { display: block; font-size: 11px; color: var(--v-muted); }
    .v2-tbl .sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 7px; }
    .v2-tbar { display: inline-flex; width: 80px; height: 7px; border-radius: 4px; background: var(--v-lane); overflow: hidden; vertical-align: middle; margin-left: 8px; }
    .v2-tbar i { display: block; height: 100%; }
    .v2-kv { display: grid; gap: 6px; font-size: 12.5px; margin-top: 10px; }
    .v2-kv div { display: flex; justify-content: space-between; gap: 10px; }
    .v2-kv span { color: var(--v-muted); }
    .v2-tip { position: absolute; z-index: 6; pointer-events: none; background: var(--v-text); color: var(--v-bg); border-radius: 9px; padding: 7px 9px; font-size: 12px; line-height: 1.45; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); min-width: 150px; max-width: 280px; }
    .v2-tip b { display: block; margin-bottom: 2px; }
    .v2-tip .r { display: flex; justify-content: space-between; gap: 14px; }
    .v2-tip .r i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
    .v2-tip .w { color: #fbbf24; margin-top: 3px; font-weight: 700; }
    .v2-tip .m { opacity: .72; margin-top: 3px; }
    @media (prefers-reduced-motion: reduce) { .ev2 * { transition: none !important; } }
</style>
<div class="ev2" id="v2">
    <div class="v2-hd">
        <div>
            <div class="v2-title" id="v2_title">Auswertung Ladesäulen</div>
            <div class="v2-crumb" id="v2_crumb"></div>
            <div class="v2-src" id="v2_src"></div>
            <div class="v2-note" id="v2_note" hidden></div>
        </div>
        <div class="v2-ctl">
            <select class="v2-sel" id="v2_scope" aria-label="Auswahl: alle Standorte, Standort oder Säule"></select>
            <div class="v2-seg" id="v2_per" role="group" aria-label="Zeitraum">

            </div>
            <div class="v2-step"><button type="button" id="v2_prev" aria-label="Vorheriger Zeitraum">‹</button><span id="v2_label"></span><button type="button" id="v2_next" aria-label="Nächster Zeitraum">›</button></div>
            <button type="button" class="v2-btn" id="v2_csv" aria-expanded="false">Export</button>
        </div>
    </div>
    <div class="v2-csv" id="v2_csvp" hidden>
        <label><input type="radio" name="v2_csvmode" value="summen" checked> Summen je Ladepunkt</label>
        <label><input type="radio" name="v2_csvmode" value="verlauf"> <span id="v2_csvverl">Je Tag und Ladepunkt</span></label>
        <button type="button" class="v2-btn" id="v2_csvmake">Datei erzeugen</button>
        <a class="v2-btn" id="v2_csvlink" href="#" target="_blank" rel="noopener" hidden>Herunterladen</a>
        <span id="v2_csvmsg" style="color:var(--v-muted)">Gilt für die aktuelle Auswahl und den Zeitraum.</span>
    </div>
    <div class="v2-tabs" role="tablist" id="v2_tabs"></div>
    <div class="v2-body" id="v2_body"></div>
    <div class="v2-tip" id="v2_tip" hidden></div>
</div>
<script>
    (function () {
        'use strict';
        var root = document.getElementById('v2'), tip = document.getElementById('v2_tip');
        var cid = 'n' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        var data = null, view = { type: 'monat', off: 0, scope: 'all' }, tab = 'over', day = null, dayOpen = false, pendingDay = null;
        var st = { heat: 'b', heatWd: null, enOff: {}, ptSort: { col: 'kwh', dir: -1 } };
        var SER_L = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
        var SER_D = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
        var NF0 = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 }), NF1 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        var WD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'], WDL = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
        var TABS = [['over', 'Übersicht'], ['energy', 'Energie'], ['occ', 'Belegung'], ['power', 'Leistung & Budget'], ['ses', 'Ladevorgänge'], ['pts', 'Ladepunkte']];

        // ---------- Helfer ----------
        function $(id) { return document.getElementById(id); }
        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function p2(n) { return (n < 10 ? '0' : '') + n; }
        function ts(s) { return new Date(s * 1000); }
        function kwh(v) { return v == null ? '–' : (v >= 100 ? NF0.format(v) : NF1.format(v)); }
        function pct(v) { return v == null ? '–' : NF0.format(v * 100) + ' %'; }
        function durH(h) { if (h == null) return '–'; return fmin(h * 60); }
        function fmin(m) { m = Math.round(m); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + p2(m % 60) + ' min'; }
        function hm(s) { var d = ts(s); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
        function dm(s) { var d = ts(s); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; }
        function dmy(s) { var d = ts(s); return d.getDate() + '.' + (d.getMonth() + 1) + '.' + d.getFullYear(); }
        function md(s) { var d = ts(s); return p2(d.getMonth() + 1) + '/' + d.getFullYear(); }
        function wdOf(s) { return (ts(s).getDay() + 6) % 7; }

        function op(v) { return (0.06 + 0.9 * Math.min(1, Math.max(0, v))).toFixed(3); }
        function niceMax(v) { if (!(v > 0)) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

        function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i] || 0; return s; }
        function q(t) { return '<span class="v2-q" title="' + esc(t) + '">?</span>'; }

        }
        function placeTip(ev, h) {
            tip.innerHTML = h; tip.hidden = false;
            var rb = root.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
            var x = ev.clientX - rb.left + 14, y = ev.clientY - rb.top - th - 10;
            if (x + tw > rb.width) x = ev.clientX - rb.left - tw - 14;
            if (y < 0) y = ev.clientY - rb.top + 16;

        function hideTip() { tip.hidden = true; }
        // Treffer-Rechtecke (.hit mit data-*): Tooltip beim Überfahren, Aktion beim Klicken
        function hits(el, tipFn, click) {
            el.onmousemove = function (ev) { var t = ev.target; if (!t.classList || !t.classList.contains('hit')) { hideTip(); return; } var h = tipFn(t.dataset); if (h) placeTip(ev, h); else hideTip(); };
            el.onmouseleave = hideTip;
            el.onclick = function (ev) { var t = ev.target; if (!t.classList || !t.classList.contains('hit')) return; hideTip(); if (click) click(t.dataset); };
        }

        function yAxis(L, R, Wd, y, max, unit, fmt) {

                s += '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + (fmt ? fmt(v) : stp >= 1 ? NF0.format(v) : NF1.format(v)) + (v + stp > max + 1e-9 && unit ? ' ' + unit : '') + '</text>';
            }
            return s;
        }

                var tp = []; for (var m = 0; m < n; m += 2) tp.push([x(Math.min(n, m + 1)), yT((tot[m] + (tot[m + 1] == null ? tot[m] : tot[m + 1])) / 2)]);
                var area = smooth(tp) + 'L' + tp[tp.length - 1][0].toFixed(1) + ',' + yT(0) + 'L' + tp[0][0].toFixed(1) + ',' + yT(0) + 'Z';
                s += '<path d="' + area + '" fill="url(#v2_cg)"/>' + (c.segs.length ? '<path d="' + area + '" clip-path="url(#v2_cc)" style="fill:var(--v-lim)" fill-opacity=".45"/>' : '') + '<path d="' + smooth(tp) + '" style="fill:none;stroke:var(--v-acc);stroke-width:2"/>';
            }
            if (lim) s += '<line class="bud" x1="' + L + '" x2="' + (L + pw) + '" y1="' + yT(lim) + '" y2="' + yT(lim) + '"/><text class="budt" x="' + (L + pw + 6) + '" y="' + (yT(lim) + 4) + '">' + esc(lbl) + '</text>' + (narrow ? '' : '<text x="' + (L + pw + 6) + '" y="' + (yT(lim) + 17) + '">' + NF1.format(lim) + ' kW</text>');
            var lastR = -1;
            c.segs.forEach(function (g2) { var a = x(g2[0]), b = x(g2[1]), t = '▲ ' + fmin(g2[1] - g2[0]), w = t.length * 6.2 + 14, mid = (a + b) / 2; if (mid - w / 2 < lastR + 6 || mid + w / 2 > Wd) return; s += '<rect x="' + (mid - w / 2) + '" y="' + (T - 22) + '" width="' + w + '" height="17" rx="8.5" style="fill:var(--v-lim-wash)"/><text class="budt" x="' + mid + '" y="' + (T - 10) + '" text-anchor="middle">' + t + '</text>'; lastR = mid + w / 2; });
            var shared = 1; lanes.forEach(function (k) { shared = Math.max(shared, k.l.peak); });
            s += '<text x="0" y="' + (y0 - 8) + '">' + (all ? 'Standorte (je gegen eigenes Budget)' : 'Ladepunkte (gleiche Skala)') + '</text><text x="' + (L + pw + 8) + '" y="' + (y0 - 8) + '">' + (narrow ? 'Spitze' : 'zur Spitze · Tag') + '</text>';
            lanes.forEach(function (k, i) {
                var l = k.l, ly = y0 + i * (laneH + gap), col = ser(l.slot), base = ly + laneH;
                var lmax = all ? Math.max(0.1, l.peak, (l.limitKw || 0) * 1.15) : shared * 1.05, yl = function (v) { return base - v / lmax * (laneH - 3); };
                s += '<rect x="' + L + '" y="' + ly + '" width="' + pw + '" height="' + laneH + '" rx="6" style="fill:var(--v-lane)"/>';
                (l.st || []).forEach(function (r) { var a = x(r[0]), w = Math.max(1, x(Math.min(r[1], n)) - a); s += r[2] === 2 ? '<rect x="' + a + '" y="' + ly + '" width="' + w + '" height="' + laneH + '" style="fill:' + col + '" fill-opacity=".15"/>' : '<rect x="' + a + '" y="' + ly + '" width="' + w + '" height="' + laneH + '" fill="url(#v2_ph' + i + ')"/>'; });
                if (all) { (l.segs || []).forEach(function (g2) { s += '<rect x="' + x(g2[0]) + '" y="' + ly + '" width="' + Math.max(1, x(g2[1]) - x(g2[0])) + '" height="' + laneH + '" style="fill:var(--v-lim)" fill-opacity=".16"/>'; }); if (l.limitKw) s += '<line class="bud" style="stroke-width:1" x1="' + L + '" x2="' + (L + pw) + '" y1="' + yl(l.limitKw) + '" y2="' + yl(l.limitKw) + '"/>'; }
                if (l.peak > 0.05) { var lp = []; for (var m2 = 0; m2 < n; m2 += 5) { var a5 = 0, c5 = 0; for (var j = m2; j < Math.min(n, m2 + 5); j++) { a5 += k.v[j]; c5++; } lp.push([x(Math.min(n, m2 + 2.5)), yl(a5 / c5)]); } s += '<path d="' + smooth(lp) + '" style="fill:none;stroke:' + col + ';stroke-width:1.6"/>'; }
                else if (!(l.st || []).length) s += '<text x="' + (L + 8) + '" y="' + (ly + laneH / 2 + 4) + '">kein Ladevorgang</text>';
                var nm = l.name, mx = Math.max(3, Math.floor((L - 24) / 6.4)); if (nm.length > mx) nm = nm.slice(0, mx - 1) + '…';
                s += '<rect x="0" y="' + (ly + laneH / 2 - 5) + '" width="10" height="10" rx="3" style="fill:' + col + '"/><text x="16" y="' + (ly + laneH / 2 + 4) + '" style="fill:var(--v-text)">' + esc(nm) + '</text>';
                s += '<text x="' + (L + pw + 8) + '" y="' + (ly + laneH / 2 + 4) + '"><tspan style="fill:var(--v-text);font-weight:700">' + (l.atPeak == null ? '–' : NF1.format(l.atPeak) + ' kW') + '</tspan>' + (narrow ? '' : ' · ' + kwh(l.kwh) + ' kWh') + '</text>';
                if (all && l.drill) s += '<rect class="hit" data-ls="' + esc(l.drill) + '" x="0" y="' + ly + '" width="' + (L - 4) + '" height="' + laneH + '"/>';
            });
            if (!all) c.segs.forEach(function (g2) { s += '<rect x="' + x(g2[0]) + '" y="' + y0 + '" width="' + Math.max(1, x(g2[1]) - x(g2[0])) + '" height="' + (yEnd - y0) + '" style="fill:var(--v-lim)" fill-opacity=".12"/>'; });
            if (c.peak) { var px = x(c.peak.m + 0.5), py = yT(c.peak.kw); s += '<line x1="' + px + '" x2="' + px + '" y1="' + py + '" y2="' + yEnd + '" style="stroke:var(--v-text);stroke-opacity:.4;stroke-dasharray:2 3"/><circle cx="' + px + '" cy="' + py + '" r="4" style="fill:var(--v-text);stroke:var(--v-bg);stroke-width:2"/>'; }
            var stp = pw < 260 ? 12 : pw < 480 ? 6 : 3;
            for (var hh = 0; hh <= 24; hh += stp) { var dt = ts(c.day); dt.setHours(hh, 0, 0, 0); s += '<text x="' + x((dt.getTime() / 1000 - c.day) / 60) + '" y="' + (yEnd + 16) + '" text-anchor="' + (hh === 0 ? 'start' : hh === 24 ? 'end' : 'middle') + '">' + p2(hh % 24) + ':00</text>'; }
            s += '<line class="xh" x1="0" x2="0" y1="' + T + '" y2="' + yEnd + '" visibility="hidden"/>';
            el.innerHTML = s + '</svg>';
            var svg = el.firstChild, xh = svg.querySelector('.xh');
            el.onmousemove = function (ev) {
                var t = ev.target; if (t.classList && t.classList.contains('hit')) { placeTip(ev, '<b>' + esc(t.getAttribute('data-ls').split(':')[1] || '') + '</b><div class="m">Klicken: Lastverlauf je Ladepunkt</div>'); return; }
                var rb = svg.getBoundingClientRect(), sx = (ev.clientX - rb.left) * Wd / rb.width, mm = Math.floor((sx - L) / pw * c.len);
                if (sx < L || sx > L + pw || mm >= n || mm < 0) { xh.setAttribute('visibility', 'hidden'); hideTip(); return; }
                xh.setAttribute('x1', x(mm + 0.5)); xh.setAttribute('x2', x(mm + 0.5)); xh.setAttribute('visibility', 'visible');
                var h = '<b>' + hm(c.day + mm * 60) + ' Uhr · ' + NF1.format(tot[mm]) + ' kW</b>', on = lanes.filter(function (k) { return k.v[mm] > 0.05 || stAt(k.l.st, mm); }), nl = 0, nb = 0, nn = 0;
                on.sort(function (a, b) { return b.v[mm] - a.v[mm]; });
                on.forEach(function (k) {
                    var sv = stAt(k.l.st, mm), v = k.v[mm] > 0.05 ? NF1.format(k.v[mm]) + ' kW' : sv === 1 && !all ? 'steckt, 0 kW' : '0 kW';
                    if (all) { var oc = occAt(k.l.occ, mm), pp = []; if (oc[0]) pp.push(oc[0] + ' lädt'); if (oc[1]) pp.push(oc[1] + ' steckt'); if (pp.length) v += ' · ' + pp.join(', '); }
                    h += '<div class="r"><span><i style="background:' + ser(k.l.slot) + '"></i>' + esc(k.l.name) + '</span><span>' + v + '</span></div>';
                });
                lanes.forEach(function (k) { if (all) { var oc = occAt(k.l.occ, mm); nl += oc[0]; nb += oc[1]; nn += k.l.n || 0; } else { var sv = stAt(k.l.st, mm); nl += sv === 2 ? 1 : 0; nb += sv === 1 ? 1 : 0; nn++; } });
                if (!on.length) h += '<div class="m">' + (all ? 'kein Standort lädt' : 'keine Wallbox lädt') + '</div>';
                h += '<div class="m">' + nl + ' lädt · ' + nb + ' angesteckt ohne Laden · ' + Math.max(0, nn - nl - nb) + ' frei</div>';
                c.segs.forEach(function (g2) { if (mm >= g2[0] && mm < g2[1]) h += '<div class="w">▲ am ' + esc(lbl) + ' ' + hm(c.day + g2[0] * 60) + '–' + hm(c.day + g2[1] * 60) + ' Uhr</div>'; });
                placeTip(ev, h);
            };
            el.onmouseleave = function () { xh.setAttribute('visibility', 'hidden'); hideTip(); };
            el.onclick = function (ev) { var t = ev.target; if (t.classList && t.classList.contains('hit') && t.getAttribute('data-ls')) { pendingDay = c.day; setView({ scope: t.getAttribute('data-ls') }); } };
        }

        // =====================================================================
        // Ladevorgänge (Etappe 1: Kennzahlen aus dem Bericht)
        // =====================================================================
        function tSes(g, d) {
            var k = d.kpi, det = k.ses != null;
            var kp = [['Ladevorgänge', det ? NF0.format(k.ses) : '–', '', det ? (d.unit === 'Tag' ? 'im Zeitraum' : 'im Zeitraum') : noDetail(d)],
                ['Ø Energie', k.avgKwh == null ? '–' : kwh(k.avgKwh), k.avgKwh == null ? '' : 'kWh', 'je Ladevorgang'],
                ['Ø Standzeit', durH(k.avgDur), '', 'vom Anstecken bis zum Abstecken'],
                ['Ø davon lädt', k.avgDur != null && k.occ && k.load != null ? durH(k.avgDur * k.load / k.occ) : '–', '', 'Rest: steht ohne zu laden']];
            kp.forEach(function (x) { card(g, 'c3 v2-kpi static', '<div class="l"><span>' + x[0] + '</span></div><div class="v">' + x[1] + '<small>' + x[2] + '</small></div><div class="s">' + x[3] + '</div>'); });
            if (k.occ && k.load != null) {
                var a = k.load / k.occ;
                card(g, '', '<div class="v2-ch"><h4>Wie die Standzeit genutzt wird</h4><span class="m">Anteil an der belegten Zeit</span></div><div class="v2-bar2" style="height:22px;border-radius:7px"><i style="width:' + (a * 100).toFixed(1) + '%;background:var(--v-acc)"></i><i class="v2-h" style="width:' + ((1 - a) * 100).toFixed(1) + '%"></i></div>' +
                    '<div class="v2-lg"><span><i style="background:var(--v-acc)"></i>lädt ' + pct(a) + (k.avgDur != null ? ' (Ø ' + durH(k.avgDur * a) + ')' : '') + '</span><span><i class="hh"></i>steht ohne Laden ' + pct(1 - a) + (k.avgDur != null ? ' (Ø ' + durH(k.avgDur * (1 - a)) + ')' : '') + '</span></div>');
            }
            var rows = d.rows.filter(function (r) { return r.ses; }).sort(function (a2, b) { return b.ses - a2.ses; }), mx = rows.length ? rows[0].ses : 1;
            if (rows.length) card(g, '', '<div class="v2-ch"><h4>Ladevorgänge je ' + (d.scope.level === 'all' ? 'Standort' : 'Ladepunkt') + '</h4></div><div class="v2-tbl"><table style="min-width:0"><thead><tr><th></th><th>Vorgänge</th><th>Ø Energie</th><th>Ø Standzeit</th></tr></thead><tbody>' + rows.map(function (r) {
                return '<tr' + (r.drill ? ' data-drill="' + esc(r.drill) + '"' : '') + '><td>' + esc(r.label) + '</td><td>' + r.ses + '<span class="v2-tbar"><i style="width:' + (r.ses / mx * 100).toFixed(1) + '%;background:var(--v-acc)"></i></span></td><td>' + kwh(r.avgKwh) + ' kWh</td><td>' + durH(r.avgDur) + '</td></tr>';
            }).join('') + '</tbody></table></div>');
            soon(g, '<b>Mit dem nächsten Update:</b> Liste aller Ladevorgänge (Beginn, Ende, Energie, Ladezeit, Standzeit ohne Laden, gedrosselt ja/nein) sowie Verteilungen von Ankunftszeit, Energie und Standzeit.');
        }

        // =====================================================================
        // Ladepunkte
        // =====================================================================
        function tPts(g, d) {
            var all = d.scope.level === 'all', s = st.ptSort, T = sum(d.rows.map(function (r) { return r.kwh; })) || 1;
            var cols = [{ k: 'label', l: all ? 'Standort' : 'Ladepunkt' }, { k: 'kwh', l: 'Energie' }, { k: 'share', l: 'Anteil' }, { k: 'ses', l: 'Vorgänge' }, { k: 'avgKwh', l: 'Ø kWh' }, { k: 'avgDur', l: 'Ø Standzeit' }, { k: 'occ', l: 'Auslastung' }];
            var rows = d.rows.map(function (r) { var o = Object.assign({}, r); o.share = r.kwh / T; return o; });
            rows.sort(function (a, b) { if (s.col === 'label') return s.dir * a.label.localeCompare(b.label); var x = a[s.col], y = b[s.col]; return s.dir * ((x == null ? -1 : x) - (y == null ? -1 : y)); });
            var mx = Math.max.apply(null, rows.map(function (r) { return r.kwh; }).concat([0.001])), k = d.kpi;
            var c = card(g, '', '<div class="v2-ch"><h4>' + (all ? 'Standorte' : 'Ladepunkte') + '</h4><span class="m">' + (all || d.scope.level === 'site' ? 'Zeile anklicken: ' + (all ? 'Standort' : 'Säule') + ' öffnen · ' : '') + 'Spaltenkopf: sortieren</span></div><div class="v2-tbl"><table><thead><tr>' + cols.map(function (cc) {
                var on = s.col === cc.k; return '<th data-k="' + cc.k + '"' + (on ? ' aria-sort="' + (s.dir < 0 ? 'descending' : 'ascending') + '"' : '') + '>' + cc.l + (on ? (s.dir < 0 ? ' ↓' : ' ↑') : '') + '</th>';
            }).join('') + '</tr></thead><tbody>' + rows.map(function (r) {
                var l = r.load == null ? 0 : r.load;
                return '<tr' + (r.drill ? ' data-drill="' + esc(r.drill) + '" tabindex="0"' : '') + '><td><b>' + esc(r.label) + '</b>' + (r.sub ? '<span class="sub">' + esc(r.sub) + '</span>' : '') + '</td><td>' + kwh(r.kwh) + ' kWh<span class="v2-tbar"><i style="width:' + (r.kwh / mx * 100).toFixed(1) + '%;background:var(--v-acc)"></i></span></td><td>' + pct(r.share) + '</td><td>' + (r.ses == null ? '–' : r.ses) + '</td><td>' + kwh(r.avgKwh) + '</td><td>' + durH(r.avgDur) + '</td>' +
                    '<td>' + pct(r.occ) + (r.occ == null ? '' : '<span class="v2-tbar"><i style="width:' + (l * 100).toFixed(1) + '%;background:var(--v-acc)"></i><i class="v2-h" style="width:' + (Math.max(0, r.occ - l) * 100).toFixed(1) + '%"></i></span>') + '</td></tr>';
            }).join('') + '</tbody><tfoot><tr><td>Summe</td><td>' + kwh(T) + ' kWh</td><td>100 %</td><td>' + (k.ses == null ? '–' : k.ses) + '</td><td>' + kwh(k.avgKwh) + '</td><td>' + durH(k.avgDur) + '</td><td>' + pct(k.occ) + '</td></tr></tfoot></table></div>' +
                '<div class="v2-lg"><span>Auslastung:</span><span><i style="background:var(--v-acc)"></i>lädt aktiv</span><span><i class="hh"></i>angesteckt, lädt nicht</span></div>');
            c.querySelectorAll('th').forEach(function (th) { th.onclick = function (e) { e.stopPropagation(); var kk = th.getAttribute('data-k'); if (s.col === kk) s.dir = -s.dir; else { s.col = kk; s.dir = kk === 'label' ? 1 : -1; } render(); }; });
            soon(g, '<b>Mit dem nächsten Update:</b> Ladepunkt anklicken für Details: Belegungskalender (jeder Tag von 0 bis 24 Uhr), Ladevorgänge und Mini-Verlauf je Ladepunkt.');
        }

        // ---------- Bedienung ----------
        $('v2_per').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setView({ type: b.getAttribute('data-p'), off: 0 }); });
        $('v2_prev').addEventListener('click', function () { setView({ off: view.off - 1 }); });
        $('v2_next').addEventListener('click', function () { if (view.off < 0) setView({ off: view.off + 1 }); });
        $('v2_scope').addEventListener('change', function () { setView({ scope: this.value }); });
        $('v2_tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) go(b.getAttribute('data-t')); });
        $('v2_csv').addEventListener('click', function () { var p = $('v2_csvp'); p.hidden = !p.hidden; this.setAttribute('aria-expanded', String(!p.hidden)); });
        $('v2_csvmake').addEventListener('click', function () {
            var r = root.querySelector('input[name="v2_csvmode"]:checked');
            $('v2_csvlink').hidden = true; $('v2_csvmsg').textContent = 'Datei wird erzeugt …';

        });
        root.addEventListener('click', function (e) {
            var b = e.target.closest('[data-scope]'); if (b && root.contains(b)) { setView({ scope: b.getAttribute('data-scope') }); return; }
            var tr = e.target.closest('tr[data-drill]'); if (tr && root.contains(tr)) { setView({ scope: tr.getAttribute('data-drill') }); }
        });
        root.addEventListener('keydown', function (e) { if (e.key !== 'Enter') return; var tr = e.target.closest && e.target.closest('tr[data-drill]'); if (tr) setView({ scope: tr.getAttribute('data-drill') }); });
        var pend = false, lastW = 0;
        function redraw() { if (!data || root.clientWidth === 0) return; if (Math.abs(root.clientWidth - lastW) < 2) return; lastW = root.clientWidth; render(); }
        try { new ResizeObserver(function () { if (pend) return; pend = true; requestAnimationFrame(function () { pend = false; redraw(); }); }).observe(root); } catch (e) { window.addEventListener('resize', redraw); }

        // ---------- Nachrichten vom Modul (nur mit eigener Kennung) ----------
        function parse(m, depth) {
            depth = depth || 0; if (depth > 3) return null;
            if (typeof m === 'string') { try { m = JSON.parse(m); } catch (e) { return null; } return parse(m, depth + 1); }
            if (!m || typeof m !== 'object') return null;
            if (m.ev === 'report' || m.ev === 'csv' || m.ev === 'day') return m;
            var keys = ['data', 'value', 'payload'];
            for (var i = 0; i < keys.length; i++) if (m[keys[i]] !== undefined) return parse(m[keys[i]], depth + 1);
            return null;
        }
        function onMessage(raw) {
            var m = parse(raw);
            if (!m || !m.cid || m.cid !== cid) return;
            root.classList.remove('busy');
            if (m.ev === 'report' && m.data && Array.isArray(m.data.energy)) {
                data = m.data; view = { type: m.data.type, off: m.data.off, scope: m.data.scope.value };
                if (pendingDay != null) { var pd = pendingDay; pendingDay = null; askDay(pd); } else { dayOpen = false; day = null; }
                render();
            } else if (m.ev === 'day') { day = m.data || null; dayOpen = true; if (tab === 'power') render(); }
            else if (m.ev === 'csv') {
                var a = $('v2_csvlink');
                if (m.url) { a.href = m.url; a.hidden = false; $('v2_csvmsg').textContent = (m.lines != null ? m.lines + ' Zeilen · ' : '') + 'Link gilt 5 Minuten.'; }
                else { a.hidden = true; $('v2_csvmsg').textContent = m.error || 'Die Datei konnte nicht erzeugt werden.'; }
            }
        }
        // Mit der klassischen Ansicht in derselben Kachel: beide Empfänger aufrufen, jeder prüft seine Kennung
        var prevHandle = window.handleMessage;
        window.handleMessage = function (raw) { if (typeof prevHandle === 'function') { try { prevHandle(raw); } catch (e) { } } try { onMessage(raw); } catch (e) { } };
        window.EV2 = { shown: function () { lastW = 0; redraw(); } };
        try { new MutationObserver(function () { if (data && root.clientWidth) render(); }).observe(document.head, { childList: true, subtree: true, characterData: true }); } catch (e) { }

        var init = %%INITIAL%%;
        if (init && init.ev === 'report' && init.data) { data = init.data; view = { type: data.type, off: data.off, scope: data.scope.value }; render(); }
    })();
</script>
